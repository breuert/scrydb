name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash # uniform quoting across the Windows/macOS/Linux runners
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.9" }
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.11" }
          - { os: macos-latest, python: "3.13" }
          - { os: windows-latest, python: "3.11" }
          - { os: windows-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      # sqlite-vec needs a sqlite3 module built with loadable-extension support.
      # The runner images ship Pythons linked against SQLite builds that disable
      # it (notably on macOS), and uv's default preference only *prefers*
      # managed interpreters -- it will still pick one of those up. only-managed
      # makes the choice deterministic.
      - name: Install scrydb
        run: |
          uv python install "${{ matrix.python }}"
          uv venv --python "${{ matrix.python }}" --python-preference only-managed
          uv pip install ".[eval,test]"

      # Fail with one readable line instead of a wall of identical tracebacks if
      # the interpreter still can't load extensions. --python .venv pins the
      # environment explicitly so an ambient VIRTUAL_ENV cannot redirect it.
      - name: Verify interpreter can load SQLite extensions
        run: |
          uv run --no-project --python .venv python -c "import sqlite3,sys; c=sqlite3.connect(':memory:'); print('python:', sys.executable); print('base:', sys.base_prefix); print('sqlite:', sqlite3.sqlite_version); sys.exit(0) if hasattr(c,'enable_load_extension') else sys.exit('FATAL: interpreter lacks enable_load_extension; sqlite-vec cannot load')"

      - name: Run tests
        run: uv run --no-project --python .venv pytest -q

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # This job only packages the source, so it never loads the extension
      # and does not need a managed interpreter.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
