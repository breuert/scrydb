name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.9" }
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.11" }
          - { os: macos-latest, python: "3.13" }
          - { os: windows-latest, python: "3.11" }
          - { os: windows-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v7

      # Interpreters come from uv, not actions/setup-python: sqlite-vec needs a
      # sqlite3 module built with loadable-extension support, and setup-python's
      # macOS builds link against Apple's SQLite, which disables it. uv's
      # managed CPython builds enable it on every platform.
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      # Install the built package, not the source tree, so tests exercise
      # what users actually get from pip.
      - name: Install scrydb
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install ".[eval,test]"

      - name: Run tests
        run: uv run --no-project pytest -q

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # This job only packages the source, so it never loads the extension
      # and does not need uv's interpreter.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
